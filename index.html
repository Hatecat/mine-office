<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina de agentes</title>
<meta name="office-token" content="__OFFICE_TOKEN__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: #161a24e6; --fg: #eef1f8; --mut: #98a2b9; --line: #ffffff17;
    --busy: #4cff7a; --idle: #ffb347; --sel: #ffe14d;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5ff; color: var(--fg);
    font-family: 'VT323', ui-monospace, monospace; font-size: 19px; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 330px; display: flex; flex-direction: column;
    background: var(--panel); border: 3px solid #0b0d13; box-shadow: inset 0 0 0 2px #ffffff14, 6px 6px 0 #0005;
    image-rendering: pixelated; }
  header { padding: 12px 14px 8px; border-bottom: 2px solid var(--line); }
  h1 { margin: 0; font-size: 30px; font-weight: normal; letter-spacing: 1px; color: var(--sel); text-shadow: 2px 2px 0 #000; }
  #summary { color: var(--mut); margin-top: 2px; }
  #list { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .item { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; padding: 7px 8px; margin: 4px 0;
    border: 2px solid transparent; cursor: pointer; background: #ffffff08; }
  .item:hover { background: #ffffff12; }
  .item.sel { border-color: var(--sel); }
  .job { color: #ffd98a; font-size: 16px; }
  .modelpick { display: flex; flex-direction: column; gap: 4px; } .modelpick #fModelCount { font-size: 15px; }
  .att { font-size: 15px; padding: 0 5px; color: #14161c; background: #fff6d6; border: 2px solid #0b0d13; animation: att 1s steps(2) infinite; white-space: nowrap; }
  .att.permiso { background: #ffe0e0; } .att.cambio { background: #e2f6ea; } .att.rescate { background: #fff0dc; } .att.atasco { background: #f1e6ff; } .att.pregunta { background: #e3ecff; } .att.peticion, .att.buzon { background: #fff6d6; }
  @keyframes att { 50% { transform: translateY(-2px); } }
  .item.sub { margin-left: 18px; }
  .dot { width: 12px; height: 12px; margin-top: 5px; box-shadow: 2px 2px 0 #000; }
  .name { font-size: 22px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { font-size: 17px; text-align: right; }
  .st.busy { color: var(--busy); } .st.idle { color: var(--idle); }
  .meta { grid-column: 2 / 4; color: var(--mut); font-size: 17px; line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--mut); padding: 18px 10px; text-align: center; }
  #teams { padding: 0 14px; color: var(--mut); font-size: 17px; }
  #teams b { color: var(--fg); font-weight: normal; }
  footer { border-top: 2px solid var(--line); padding: 8px 14px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 17px; color: var(--mut); }
  footer span i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; }
  #conn { position: fixed; left: 12px; bottom: 12px; padding: 4px 10px; background: var(--panel); border: 2px solid #0b0d13; font-size: 17px; }
  #help { position: fixed; left: 12px; top: 12px; padding: 4px 10px; background: var(--panel); border: 2px solid #0b0d13; font-size: 17px; color: var(--mut); }
  .team { display: flex; align-items: center; gap: 8px; margin: 12px 4px 2px; color: var(--fg); font-size: 20px; }
  .team .tdot { width: 12px; height: 12px; box-shadow: 2px 2px 0 #000; }
  .team .grow { flex: 1; }
  button, .btn { font: inherit; font-size: 17px; color: var(--fg); background: #2a3142; border: 2px solid #0b0d13;
    box-shadow: inset 0 0 0 1px #ffffff1c; padding: 2px 10px; cursor: pointer; }
  button:hover { background: #343d52; } button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #3a5d2a; } button.primary:hover { background: #46713a; }
  button.danger { background: #5d2a2a; } button.danger:hover { background: #713a3a; }
  .mini { font-size: 15px; padding: 0 6px; }
  .st.offline { color: #8fb3ff; }
  .hdr-actions { display: flex; gap: 6px; margin-top: 8px; }
  /* chat */
  #chat { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #panel.chatting #list, #panel.chatting #teams, #panel.chatting footer { display: none; }
  #panel.chatting #chat { display: flex; }
  .chat-head { display: flex; gap: 10px; align-items: center; padding: 10px 12px 6px; border-bottom: 2px solid var(--line); }
  .chat-head .who { flex: 1; min-width: 0; }
  #chatName { font-size: 26px; line-height: 1; } #chatSub { color: var(--mut); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 2px solid var(--line); }
  #chatLog { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 92%; padding: 6px 9px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 18px; line-height: 1.15; border: 2px solid #0b0d13; }
  .msg.user { align-self: flex-end; background: #2f4a6e; }
  .msg.assistant { align-self: flex-start; background: #2a2f3c; }
  .msg.tool { align-self: flex-start; background: none; border: none; color: var(--mut); font-size: 16px; padding: 0 4px; }
  .msg.error { align-self: stretch; background: #4a2323; color: #ffb4b4; }
  .msg.note { align-self: center; background: none; border: none; color: var(--mut); text-align: center; font-size: 16px; }
  .typing { color: var(--busy); font-size: 17px; padding: 0 12px 6px; min-height: 20px; }
  #chatForm { display: flex; gap: 6px; padding: 8px 12px 12px; border-top: 2px solid var(--line); }
  #chatInput { flex: 1; resize: none; font: inherit; font-size: 18px; color: var(--fg); background: #0f1219; border: 2px solid #0b0d13; padding: 6px; }
  /* vestuario */
  dialog { color: var(--fg); background: #161a24; border: 3px solid #0b0d13; box-shadow: 8px 8px 0 #0007; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
  dialog::backdrop { background: #0006; }
  .dlg-head { padding: 12px 16px; border-bottom: 2px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .dlg-head h2 { margin: 0; font-weight: normal; font-size: 28px; color: var(--sel); flex: 1; }
  .dlg-body { padding: 10px 16px; display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; align-items: center; overflow-y: auto; max-height: calc(100vh - 180px); }
  .dlg-body label { color: var(--mut); }
  .dlg-body input[type=text], .dlg-body input[type=search], .dlg-body select, .dlg-body textarea { font: inherit; font-size: 18px; color: var(--fg); background: #0f1219; border: 2px solid #0b0d13; padding: 4px 6px; width: 100%; box-sizing: border-box; }
  .dlg-body textarea { resize: vertical; min-height: 70px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .sw { width: 22px; height: 22px; border: 2px solid #0b0d13; cursor: pointer; padding: 0; box-shadow: none; }
  .sw.on { outline: 3px solid var(--sel); }
  .hint { grid-column: 1 / 3; color: var(--mut); font-size: 16px; margin: -4px 0 0; }
  .warn { color: #ffb4b4; }
  .dlg-foot { padding: 10px 16px 14px; border-top: 2px solid var(--line); display: flex; gap: 8px; }
  .dlg-foot .grow { flex: 1; }
  dialog.wide { width: min(860px, calc(100vw - 32px)); }
  .cost-body { display: block; padding: 6px 16px 16px; overflow: auto; max-height: calc(100vh - 110px); }
  .cost-body h3 { font-weight: normal; font-size: 22px; color: var(--sel); margin: 16px 0 6px; }
  .cnote { color: var(--mut); font-size: 16px; margin: 6px 0 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .kpi { background: #0f1219; border: 2px solid #0b0d13; box-shadow: inset 0 0 0 2px #ffffff10; padding: 8px 12px; }
  .kl { color: var(--mut); font-size: 16px; } .kv { font-size: 34px; line-height: 1.05; } .ks { color: var(--mut); font-size: 15px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 16px; color: var(--fg); margin-bottom: 4px; }
  .legend i, .sw2 { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 1px solid #0b0d13; vertical-align: -1px; }
  .chartwrap { position: relative; }
  .chart { width: 100%; height: auto; display: block; }
  .chart .grid { stroke: #ffffff14; stroke-width: 1; } .chart .ax { fill: var(--mut); font: 14px VT323, monospace; }
  .chart .hit { fill: transparent; } .chart .bar.on .hit { fill: #ffffff0d; }
  .tip { position: absolute; display: none; pointer-events: none; white-space: pre; background: #0b0d13; border: 2px solid #ffffff30; padding: 4px 8px; font-size: 16px; z-index: 2; }
  .tbl { overflow-x: auto; }
  .tbl table { width: 100%; border-collapse: collapse; font-size: 17px; }
  .tbl th { text-align: left; color: var(--mut); font-weight: normal; border-bottom: 2px solid var(--line); padding: 3px 8px 3px 0; white-space: nowrap; }
  .tbl td { border-bottom: 1px solid var(--line); padding: 4px 8px 4px 0; vertical-align: top; }
  .tbl td:nth-child(n+3) { white-space: nowrap; }
  .tbl.runs td:nth-child(3) { white-space: normal; } .tbl.runs td:first-child { white-space: nowrap; }
  .mut { color: var(--mut); } .bad { color: #ff8a8a; } .warnc { color: #ffc77a; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #161a24; border: 2px solid #0b0d13; padding: 6px 14px; display: none; z-index: 9; }
  @media (max-width: 760px) {
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 42vh; }
    #conn { bottom: calc(42vh + 16px); left: 8px; } #help { display: none; }
  }
</style>
<script>
  // Muestra cualquier error en pantalla (si el módulo no arranca, aquí se ve por qué)
  function showErr(msg) { const s = document.getElementById('summary'); if (s) { s.style.color = '#ff6b6b'; s.textContent = 'Error: ' + msg; } }
  addEventListener('error', e => showErr(e.message || (e.target && e.target.src) || 'desconocido'), true);
  addEventListener('unhandledrejection', e => showErr(String(e.reason)));
</script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="help">arrastra: girar · clic derecho: mover · rueda: zoom · clic: seguir agente</div>
<aside id="panel">
  <header><h1>Oficina de agentes</h1><div id="summary">conectando…</div>
    <div class="hdr-actions"><button id="btnHire" class="mini">+ Contratar</button><button id="btnTeam" class="mini">+ Equipo</button><button id="btnCosts" class="mini">$ Gastos</button><button id="btnVoice" class="mini" title="Liberty, la secretaria, dice en voz alta cuando un agente te necesita">♪ Voz</button><button id="btnListen" class="mini" title="Liberty escucha el micrófono: empieza la frase con «Liberty…»">🎙 Escucha</button></div></header>
  <div id="list"></div>
  <section id="chat">
    <div class="chat-head"><button id="chatBack" title="Volver">←</button><div class="who"><div id="chatName"></div><div id="chatSub"></div></div></div>
    <div class="chat-actions"><button id="btnWindow">Abrir ventana</button><button id="btnDress">Vestuario</button><button id="btnStop" class="danger">Detener</button><button id="btnRestore" hidden title="El PM le cambió el modelo porque se quedó sin cuota">Volver</button></div>
    <div id="chatLog"></div>
    <div class="typing" id="chatTyping"></div>
    <form id="chatForm"><textarea id="chatInput" rows="2" placeholder="Escribe una orden…"></textarea><button class="primary" id="chatSend">Enviar</button></form>
  </section>
  <div id="teams"></div>
  <footer id="legend"></footer>
</aside>
<div id="conn">…</div>
<div id="toast"></div>
<dialog id="costs" class="wide">
  <form method="dialog">
    <div class="dlg-head"><h2>Gastos</h2><button type="button" id="costRefresh" class="mini">Actualizar</button><button value="cancel">✕</button></div>
    <div class="dlg-body cost-body" id="costBody"></div>
  </form>
</dialog>
<dialog id="dress">
  <form method="dialog" id="dressForm">
    <div class="dlg-head"><h2 id="dressTitle">Vestuario</h2><button value="cancel" formnovalidate>✕</button></div>
    <div class="dlg-body">
      <label for="fName">Nombre</label><input type="text" id="fName" maxlength="40" required>
      <label for="fJob">Cargo</label><input type="text" id="fJob" maxlength="40" placeholder="Programadora, Tester, Diseñador UX…">
      <label for="fTeam">Equipo</label><select id="fTeam"></select>
      <label for="fPersona">Personalidad</label><textarea id="fPersona" maxlength="1500" placeholder="Cómo es, cómo habla, en qué es bueno…"></textarea>
      <label>Motor</label><div class="swatches"><label><input type="radio" name="fEngine" value="claude"> Claude</label><label><input type="radio" name="fEngine" value="opencode"> OpenCode</label></div>
      <label for="fModel">Modelo</label><div class="modelpick"><input type="search" id="fModelFilter" placeholder="Filtrar: free, gpt, copilot claude, nvidia…" autocomplete="off"><select id="fModel"></select><span id="fModelCount" class="mut"></span></div>
      <label for="fPerm">Permisos</label><select id="fPerm"></select>
      <p class="hint" id="permHint"></p>
      <label id="fSkillsRow">Habilidades</label><div id="fSkills" class="swatches"></div>
      <p class="hint" id="fSkillsHint">Herramientas que puede usar sin pedirte permiso, aunque sea de «solo leer». Solo con Claude.</p>
      <label for="fCwd">Carpeta</label><input type="text" id="fCwd" placeholder="~/Documentos/proyecto">
      <p class="hint">Donde trabaja. Cambiar el motor o la carpeta le da una conversación nueva.</p>
      <label>Piel</label><div class="swatches" data-look="skin"></div>
      <label>Pelo</label><div class="swatches" data-look="hair"></div>
      <label>Camiseta</label><div class="swatches" data-look="shirt"></div>
      <label>Pantalón</label><div class="swatches" data-look="pants"></div>
      <label for="fAcc">Accesorio</label><select id="fAcc"><option value="ninguno">Ninguno</option><option value="gafas">Gafas</option><option value="gorra">Gorra</option><option value="auriculares">Auriculares</option></select>
    </div>
    <div class="dlg-foot"><button type="button" class="danger" id="dressFire">Despedir</button><span class="grow"></span><button value="cancel" formnovalidate>Cancelar</button><button class="primary" id="dressSave" value="save">Guardar</button></div>
  </form>
</dialog>

<script type="module" src="./lib/app.js"></script>
</body>
</html>
